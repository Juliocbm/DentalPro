<div class="page page-center">
  <div class="container-tight py-4">
    <div class="text-center mb-4">
      <a href="#" class="navbar-brand navbar-brand-autodark"><span class="fs-2">DentalPro</span></a>
    </div>
    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="card card-md">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">Recuperar contraseña</h2>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input formControlName="email" type="email" class="form-control" placeholder="tu@email.com" />
        </div>
        <button class="btn btn-primary w-100" [disabled]="loading">Recuperar contraseña</button>
        <div *ngIf="msg" class="alert alert-success mt-2">{{ msg }}</div>
        <div *ngIf="errorMsg" class="alert alert-danger mt-2">{{ errorMsg }}</div>
      </div>
    </form>
    <div class="text-center mt-3">
      <a routerLink="/auth/login">Volver a iniciar sesión</a>
    </div>
  </div>
</div>
